name: Python CI

# The same gate as pyBlindOpt and torann, so a change that passes locally
# in one repository passes in all three. torann adds two Rust steps on
# top of this; nothing else differs.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.14"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Pinned, and matching requirements.txt. Unpinned, a linter
          # release that enables new rules by default fails a PR that changed
          # none of the code it flags -- which is what happened at ruff 0.16.
          # Pinned in pyproject's `dev` extra, the single source of truth
          # this job and `pre-commit` both install from -- they used to name
          # versions separately and drifted.
          pip install ".[dev]"

      - name: Lint with Ruff
        run: ruff check src test examples

      - name: Type-check with basedpyright
        run: basedpyright

      - name: Dead code with Vulture
        run: vulture

      - name: Run tests with coverage
        run: |
          python -m coverage run --source=src/ess -m unittest discover -s test
          python -m coverage report -m --fail-under=85
