name: Python CI

# The same gate as pyBlindOpt and torann, so a change that passes locally
# in one repository passes in all three. torann adds two Rust steps on
# top of this; nothing else differs.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.14"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff basedpyright vulture
          pip install .

      - name: Lint with Ruff
        run: ruff check src

      - name: Type-check with basedpyright
        run: basedpyright

      - name: Dead code with Vulture
        run: vulture

      - name: Run tests
        run: python -m unittest discover -s test
