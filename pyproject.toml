[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "EmptySpaceSearch"
version = "0.7.1"
authors = [
    {name = "Mário Antunes", email = "mario.antunes@ua.pt"}
]
description = "Empty Space Search"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy>=2.0.0",
    "torann>=0.5.0",
]

[project.optional-dependencies]
# The gate's toolchain, pinned in one place so `pre-commit` and
# `.github/workflows` cannot run different versions of it. They used to name
# versions separately and drifted -- CI pinned basedpyright 1.39.8 while this
# repository's venv had 1.39.9 -- and `language: system` hooks, which is what
# these are deliberately, run whatever is installed.
#
# Install with: pip install -e ".[dev]"
dev = [
    "ruff==0.16.1",
    "basedpyright==1.39.8",
    "vulture==2.16",
    "coverage==7.14.2",
    "pre-commit",
    # Only the plot examples need it. It is here so `test_examples.py`
    # actually runs them in CI instead of skipping them, which is the whole
    # point of that test.
    "matplotlib",
]

[project.urls]
Homepage = "https://github.com/mariolpantunes/ess"
Documentation = "https://mariolpantunes.github.io/ess/"
Repository = "https://github.com/mariolpantunes/ess"
Issues = "https://github.com/mariolpantunes/ess/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120

[tool.ruff.lint.per-file-ignores]
# `test/` and `examples/` are linted now -- they are where the rot happens --
# but two rules are noise outside the package: B023 (a closure over a loop
# variable, always consumed in the same iteration by a benchmark harness
# here) and RUF059 (an unused half of `idx, dst = ...` in a test that only
# asserts on one). Everything else applies, correctness rules included.
"test/**" = ["B023", "RUF059"]
"examples/**" = ["B023", "RUF059"]

[tool.basedpyright]
typeCheckingMode = "standard"
include = ["src/ess"]
reportImportCycles = "none"

[tool.vulture]
paths = ["src/ess"]
min_confidence = 80
